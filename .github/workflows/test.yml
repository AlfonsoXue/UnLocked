name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          .\tests\Test-UnLocked.ps1
          exit $LASTEXITCODE
